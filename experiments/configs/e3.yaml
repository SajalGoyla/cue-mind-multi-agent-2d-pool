# E3: SA vs MA in games that start from 20 test positions (both seat orders).
# Shorter and less luck-dominated than full racks from the break (plan section 11.1).
exp_id: e3
pairings:
  - [ma, sa]
start_positions: {file: data/positions/test.jsonl, count: 20}
noise_levels: [medium]
max_shots: 60
prep: {access_level: L2, n_rollouts: 8}
workers: 2
policy_kwargs:
  sa: {llm: ollama}
  ma: {llm: ollama}
