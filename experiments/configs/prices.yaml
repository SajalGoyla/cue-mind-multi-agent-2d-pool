# USD per million tokens, used for cost estimates and the --max-usd budget guard.
# Values below are Anthropic first-party list prices (checked 2026-11-20 from the
# claude-api reference; Haiku 5.5 price applies to prompts up to 100K tokens).
# Claude on Vertex AI is priced separately by Google: confirm the current Vertex
# price for each model and update these numbers before reporting costs.
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write: 2.50
