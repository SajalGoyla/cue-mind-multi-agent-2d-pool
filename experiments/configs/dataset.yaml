# Positions benchmark (plan section 9). Build: python experiments/build_dataset.py --config experiments/configs/dataset.yaml
seed: 0
n_dev: 60
n_test: 180
game_seed_start: 2000      # B2-vs-B1 games used to sample realistic positions
per_game: 2               # positions sampled per game
random_fraction: 0.2      # share of random valid placements
noise: medium
prep: {access_level: L2, n_rollouts: 8}
oracle: {m: 24, horizon: 2, noise: medium}
workers: 10
out_dir: data/positions
